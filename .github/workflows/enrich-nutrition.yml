name: Enrich Food Nutrition Data

on:
  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to enrich (leave empty for all)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        type: boolean
        default: false

  # Auto-trigger when new food files are added
  push:
    branches: [main, master]
    paths:
      - 'apps/sibo/data/foods/**/*.json'
      - '!apps/sibo/data/foods/schema.json'

jobs:
  enrich-nutrition:
    name: Enrich with USDA Data
    runs-on: ubuntu-latest

    # Don't run on commits from this workflow (prevents infinite loops)
    if: "!contains(github.event.head_commit.message, '[skip-enrich]')"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run USDA Enrichment
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        working-directory: apps/sibo
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ github.event.inputs.category }}" ]; then
            ARGS="$ARGS --category=${{ github.event.inputs.category }}"
          fi

          echo "Running: node scripts/enrich-with-usda.js $ARGS"
          node scripts/enrich-with-usda.js $ARGS

      - name: Regenerate TypeScript files
        if: github.event.inputs.dry_run != 'true'
        working-directory: apps/sibo
        run: node scripts/generate-food-data.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/sibo/data/foods apps/sibo/web/src/data/foods.ts apps/sibo/server/src/foods-full.ts
          git commit -m "chore: enrich foods with USDA nutrition data [skip-enrich]"
          git push
