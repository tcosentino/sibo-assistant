name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

  test-sibo-server:
    name: SIBO Server Tests
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Run linting
        run: npm run lint -w @apps/sibo-server --if-present

      - name: Run tests
        run: npm run test -w @apps/sibo-server

      - name: Build
        run: npm run build -w @apps/sibo-server

  test-sibo-web:
    name: SIBO Web Tests
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Run linting
        run: npm run lint -w @apps/sibo-web

      - name: Run tests
        run: npm run test -w @apps/sibo-web

      - name: Build
        run: npm run build -w @apps/sibo-web

  test-macro-tracker-server:
    name: Macro Tracker Server Tests
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Run tests
        run: npm run test -w @apps/macro-tracker-server --if-present

      - name: Build
        run: npm run build -w @apps/macro-tracker-server

  test-macro-tracker-web:
    name: Macro Tracker Web Tests
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Run tests
        run: npm run test -w @apps/macro-tracker-web --if-present

      - name: Build
        run: npm run build -w @apps/macro-tracker-web

  # E2E Tests - Only run on Pull Requests
  e2e-sibo:
    name: SIBO E2E Tests
    runs-on: ubuntu-latest
    needs: [test-sibo-web, test-sibo-server]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/sibo/web

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        working-directory: apps/sibo/web

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sibo-playwright-report
          path: apps/sibo/web/playwright-report/
          retention-days: 14

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sibo-screenshots
          path: apps/sibo/web/test-results/
          retention-days: 14

  e2e-macro-tracker:
    name: Macro Tracker E2E Tests
    runs-on: ubuntu-latest
    needs: [test-macro-tracker-web, test-macro-tracker-server]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/macro-tracker/web

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        working-directory: apps/macro-tracker/web

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-tracker-playwright-report
          path: apps/macro-tracker/web/playwright-report/
          retention-days: 14

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macro-tracker-screenshots
          path: apps/macro-tracker/web/test-results/
          retention-days: 14

  all-tests-pass:
    name: All Tests Pass
    runs-on: ubuntu-latest
    needs: [test-sibo-server, test-sibo-web, test-macro-tracker-server, test-macro-tracker-web]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test-sibo-server.result }}" != "success" ] || \
             [ "${{ needs.test-sibo-web.result }}" != "success" ] || \
             [ "${{ needs.test-macro-tracker-server.result }}" != "success" ] || \
             [ "${{ needs.test-macro-tracker-web.result }}" != "success" ]; then
            echo "Some tests failed"
            exit 1
          fi
          echo "All tests passed successfully!"

  all-e2e-pass:
    name: All E2E Tests Pass
    runs-on: ubuntu-latest
    needs: [e2e-sibo, e2e-macro-tracker]
    if: github.event_name == 'pull_request' && always()
    steps:
      - name: Check E2E results
        run: |
          if [ "${{ needs.e2e-sibo.result }}" != "success" ] || \
             [ "${{ needs.e2e-macro-tracker.result }}" != "success" ]; then
            echo "Some E2E tests failed"
            exit 1
          fi
          echo "All E2E tests passed successfully!"
