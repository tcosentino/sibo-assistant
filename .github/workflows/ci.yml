name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

  test-sibo-server:
    name: SIBO Server Tests
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Run linting
        run: npm run lint -w @apps/sibo-server --if-present

      - name: Run tests
        run: npm run test -w @apps/sibo-server

      - name: Build
        run: npm run build -w @apps/sibo-server

  test-sibo-web:
    name: SIBO Web Tests
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Run linting
        run: npm run lint -w @apps/sibo-web

      - name: Run tests
        run: npm run test -w @apps/sibo-web

      - name: Build
        run: npm run build -w @apps/sibo-web

  test-macro-tracker-server:
    name: Macro Tracker Server Tests
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Run tests
        run: npm run test -w @apps/macro-tracker-server --if-present

      - name: Build
        run: npm run build -w @apps/macro-tracker-server

  test-macro-tracker-web:
    name: Macro Tracker Web Tests
    runs-on: ubuntu-latest
    needs: build-packages

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build:packages

      - name: Run tests
        run: npm run test -w @apps/macro-tracker-web --if-present

      - name: Build
        run: npm run build -w @apps/macro-tracker-web

  all-tests-pass:
    name: All Tests Pass
    runs-on: ubuntu-latest
    needs: [test-sibo-server, test-sibo-web, test-macro-tracker-server, test-macro-tracker-web]
    steps:
      - name: All tests passed
        run: echo "All tests passed successfully!"
