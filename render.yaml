# Render.com Blueprint
# https://render.com/docs/blueprint-spec
#
# For direct deployment (non-Blueprint), use these settings:
#   Root Directory: (leave empty)
#   Build Command: npm install && npm run build
#   Publish Directory: dist

services:
  # Express API server with Claude integration
  - type: web
    name: sibo-assistant-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: HELICONE_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_PATH
        value: /var/data/sibo.db
    healthCheckPath: /api/health
    disk:
      name: sibo-data
      mountPath: /var/data
      sizeGB: 1

  # Static frontend
  - type: web
    name: sibo-food-guide
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_URL
        fromService:
          type: web
          name: sibo-assistant-api
          property: host
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
